<div class="collection-grid" id="collections-results">
  {% for col in collections %}
  <a href="{% url 'collection_detail' col.pk %}" class="collection-card">
    <div class="collection-card__left">
      <div class="collection-card__title">{{ col.title }}</div>
      {% if col.description %}
        <div class="collection-card__desc">{{ col.description }}</div>
      {% endif %}
    </div>
    
    <div class="collection-card__right">
      <div class="collection-card__creator">@{{ col.created_by.username }}</div>
      <div class="collection-card__stats">
        <div>Книг: {{ col.num_books }}</div>
        <div>Понравилось: {{ col.num_likes|default:0 }}</div>
      </div>
    </div>
  </a>
  {% empty %}
  <p class="empty" style="grid-column:1/-1;text-align:center;padding:48px 0;font-size:12px;text-transform:uppercase">
    Подборок пока нет
  </p>
  {% endfor %}
</div>
