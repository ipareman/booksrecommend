{% if user.is_authenticated %}
<button class="comment__vote-btn{% if user_vote == 1 %} comment__vote-btn--active{% endif %}"
        hx-post="{% url 'collection_comment_vote' comment.pk %}"
        hx-vals='{"value":"1"}'
        hx-target="#collection-votes-{{ comment.pk }}"
        hx-swap="innerHTML"
        hx-headers='{"X-CSRFToken":"{{ csrf_token }}"}'>&#9650;</button>
<span class="comment__score">{{ score }}</span>
<button class="comment__vote-btn{% if user_vote == -1 %} comment__vote-btn--active{% endif %}"
        hx-post="{% url 'collection_comment_vote' comment.pk %}"
        hx-vals='{"value":"-1"}'
        hx-target="#collection-votes-{{ comment.pk }}"
        hx-swap="innerHTML"
        hx-headers='{"X-CSRFToken":"{{ csrf_token }}"}'>&#9660;</button>
{% else %}
<span class="comment__score" style="font-size:12px;color:var(--ghost)">{{ score }}</span>
{% endif %}
