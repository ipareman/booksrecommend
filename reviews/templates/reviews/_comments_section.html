{% for comment in comments %}
  {% include "reviews/_comment.html" with comment=comment %}
{% empty %}
  <p class="empty">Комментариев пока нет</p>
{% endfor %}

{% if has_more_comments %}
<div style="padding:12px 0">
  <button class="btn btn-secondary btn-sm"
          hx-get="{% url 'critique_comments_page' critique.pk %}?page={{ next_page }}&sort={{ sort }}"
          hx-target="closest div" hx-swap="outerHTML">
    Показать ещё
  </button>
</div>
{% endif %}
