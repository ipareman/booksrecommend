{% extends "core/base.html" %}
{% block title %}Граф: {{ book.title }} — Строка{% endblock %}

{% block content %}
<div class="wrap page graph-page">
  <div class="graph-page__back">
    <a href="{% url 'book_detail' book.pk %}" class="lnk-muted">&larr; {{ book.title }}</a>
  </div>
  <h1 class="graph-page__title">Граф связей</h1>

  <div class="graph-container graph-canvas" id="graph">
    <!-- Контролы -->
    <div class="graph-controls">
      <button id="zoom-in" class="graph-control-btn" type="button" aria-label="Приблизить">+</button>
      <button id="zoom-out" class="graph-control-btn" type="button" aria-label="Отдалить">&minus;</button>
      <button id="zoom-reset" class="graph-control-btn graph-control-btn--text" type="button">Центр</button>
    </div>
    <!-- Легенда -->
    <div id="legend" class="graph-page-legend"></div>
    <!-- Desktop tooltip -->
    <div id="tooltip" class="graph-tooltip">
      <div class="graph-tooltip__inner">
        <img id="tt-cover" src="" class="graph-tooltip__cover">
        <div id="tt-placeholder" class="graph-tooltip__placeholder"></div>
        <div class="graph-tooltip__body">
          <div id="tt-title" class="graph-tooltip__title"></div>
          <div id="tt-authors" class="graph-tooltip__authors"></div>
          <div id="tt-rating" class="graph-tooltip__rating"></div>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Мобильная модалка -->
<div id="mobile-modal" class="graph-mobile-modal">
  <div class="graph-mobile-modal__shade" onclick="closeMobileModal()"></div>
  <div id="mobile-modal-content" class="graph-mobile-modal__sheet">
    <!-- Ручка (swipe handle) -->
    <div id="mm-handle" class="graph-mobile-modal__handle">
      <div></div>
    </div>
    <div class="graph-mobile-modal__head">
      <img id="mm-cover" src="" class="graph-mobile-modal__cover">
      <div id="mm-placeholder" class="graph-mobile-modal__placeholder"></div>
      <div class="graph-mobile-modal__body">
        <div id="mm-title" class="graph-mobile-modal__title"></div>
        <div id="mm-authors" class="graph-mobile-modal__authors"></div>
        <div id="mm-rating" class="graph-mobile-modal__rating"></div>
      </div>
    </div>
    <div id="mm-desc" class="graph-mobile-modal__desc"></div>
    <a id="mm-link" href="#" class="graph-mobile-modal__link">
      Открыть книгу
    </a>
  </div>
</div>

<script>
function closeMobileModal() {
  var content = document.getElementById('mobile-modal-content');
  content.style.transition = 'transform .25s ease-out';
  content.style.transform = 'translateY(100%)';
  setTimeout(function() { document.getElementById('mobile-modal').style.display = 'none'; }, 250);
}

// Swipe-to-dismiss
(function() {
  var handle = document.getElementById('mm-handle');
  var sheet = document.getElementById('mobile-modal-content');
  var startY = 0, currentY = 0, dragging = false;

  function onStart(e) {
    dragging = true;
    startY = (e.touches ? e.touches[0] : e).clientY;
    currentY = 0;
    sheet.style.transition = 'none';
  }
  function onMove(e) {
    if (!dragging) return;
    var y = (e.touches ? e.touches[0] : e).clientY;
    currentY = Math.max(0, y - startY);
    sheet.style.transform = 'translateY(' + currentY + 'px)';
  }
  function onEnd() {
    if (!dragging) return;
    dragging = false;
    sheet.style.transition = 'transform .25s ease-out';
    if (currentY > 80) {
      closeMobileModal();
    } else {
      sheet.style.transform = 'translateY(0)';
    }
  }

  handle.addEventListener('touchstart', onStart, {passive: true});
  document.addEventListener('touchmove', function(e) { if (dragging) onMove(e); }, {passive: true});
  document.addEventListener('touchend', onEnd);
  handle.addEventListener('mousedown', onStart);
  document.addEventListener('mousemove', function(e) { if (dragging) onMove(e); });
  document.addEventListener('mouseup', onEnd);
})();
</script>
{% endblock %}

{% block extra_scripts %}
<script src="https://d3js.org/d3.v7.min.js"></script>
<script>
(function() {
  const container = document.getElementById('graph');
  const width = container.clientWidth;
  const height = container.clientHeight;
  const tooltip = document.getElementById('tooltip');
  const isMobile = 'ontouchstart' in window || window.innerWidth <= 768;
  const css = getComputedStyle(document.documentElement);
  const ink = css.getPropertyValue('--ink').trim();
  const muted = css.getPropertyValue('--muted').trim();
  const ghost = css.getPropertyValue('--ghost').trim();
  const bg = css.getPropertyValue('--bg').trim();
  const surface = css.getPropertyValue('--surface').trim();
  const border = css.getPropertyValue('--border').trim();
  const relationPalette = {
    same_author: '#6f7690',
    same_genre: '#6f8a78',
    same_series: '#9a8662',
    also_read: '#81728e',
    influenced_by: '#9a6f69',
    response_to: '#927080',
    similar_theme: '#6d8790',
    sequel: '#9a7a63',
    prequel: '#7f8a68'
  };
  function relationColor(link) {
    return relationPalette[link.type] || muted;
  }

  const svg = d3.select('#graph').append('svg')
    .attr('width', width).attr('height', height)
    .style('font-family', '"Mltsvfont", monospace');

  const g = svg.append('g');

  // Zoom — с поддержкой touch (pan + pinch)
  const zoom = d3.zoom()
    .scaleExtent([0.3, 4])
    .filter(function(e) {
      // Разрешаем touch-события для pan/pinch
      if (e.type === 'touchstart' || e.type === 'touchmove' || e.type === 'touchend') return true;
      // На десктопе — колёсико и drag средней кнопкой
      return !e.button;
    })
    .on('zoom', e => g.attr('transform', e.transform));
  svg.call(zoom);

  document.getElementById('zoom-in').onclick = () => svg.transition().duration(300).call(zoom.scaleBy, 1.4);
  document.getElementById('zoom-out').onclick = () => svg.transition().duration(300).call(zoom.scaleBy, 0.7);
  document.getElementById('zoom-reset').onclick = () => svg.transition().duration(500).call(zoom.transform, d3.zoomIdentity);

  // Desktop tooltip
  function showTooltip(e, d) {
    if (isMobile) return;
    const rect = container.getBoundingClientRect();
    document.getElementById('tt-title').textContent = d.title;
    document.getElementById('tt-authors').textContent = d.authors || '';
    var cover = document.getElementById('tt-cover');
    var ph = document.getElementById('tt-placeholder');
    if (d.cover) { cover.src = d.cover; cover.style.display = 'block'; ph.style.display = 'none'; }
    else { cover.style.display = 'none'; ph.style.display = 'flex'; ph.textContent = d.title.charAt(0).toUpperCase(); }
    var rEl = document.getElementById('tt-rating');
    if (d.rating) { rEl.textContent = '\u2605 ' + d.rating.toFixed(1); rEl.style.display = 'block'; }
    else { rEl.style.display = 'none'; }
    tooltip.style.left = Math.min(e.clientX - rect.left + 16, width - 240) + 'px';
    tooltip.style.top = (e.clientY - rect.top - 10) + 'px';
    tooltip.style.display = 'block';
  }
  function hideTooltip() { tooltip.style.display = 'none'; }

  // Mobile modal
  function showMobileModal(d) {
    document.getElementById('mm-title').textContent = d.title;
    document.getElementById('mm-authors').textContent = d.authors || '';
    document.getElementById('mm-link').href = '/books/' + d.id + '/';

    var cover = document.getElementById('mm-cover');
    var ph = document.getElementById('mm-placeholder');
    if (d.cover) { cover.src = d.cover; cover.style.display = 'block'; ph.style.display = 'none'; }
    else { cover.style.display = 'none'; ph.style.display = 'flex'; ph.textContent = d.title.charAt(0).toUpperCase(); }

    var rEl = document.getElementById('mm-rating');
    if (d.rating) { rEl.textContent = '\u2605 ' + d.rating.toFixed(1); rEl.style.display = 'block'; }
    else { rEl.style.display = 'none'; }

    var descEl = document.getElementById('mm-desc');
    if (d.description) { descEl.textContent = d.description; descEl.style.display = 'block'; }
    else { descEl.style.display = 'none'; }

    document.getElementById('mobile-modal').style.display = 'block';
    // Trigger slide-up animation
    requestAnimationFrame(function() {
      document.getElementById('mobile-modal-content').style.transform = 'translateY(0)';
    });
  }

  fetch('{% url "book_graph_data" book.pk %}')
    .then(r => r.json())
    .then(data => {
      if (!data.nodes.length) {
        svg.append('text').attr('x', width/2).attr('y', height/2)
          .attr('text-anchor', 'middle').attr('fill', ghost).attr('font-size', '14px')
          .text('Связей пока нет');
        return;
      }

      // Legend
      var types = [...new Set(data.links.map(l => l.type))];
      var legendEl = document.getElementById('legend');
      var activeTypes = new Set(types);
      types.forEach(t => {
        var lnk = data.links.find(l => l.type === t);
        var item = document.createElement('button');
        item.type = 'button';
        item.className = 'graph-page-legend__item';
        item.dataset.relationType = t;
        item.setAttribute('aria-pressed', 'true');
        item.innerHTML = '<span class="graph-page-legend__line"></span><span>' + lnk.label + '</span>';
        item.style.color = relationColor(lnk);
        item.addEventListener('click', function() {
          if (activeTypes.has(t)) activeTypes.delete(t);
          else activeTypes.add(t);
          item.classList.toggle('is-off', !activeTypes.has(t));
          item.setAttribute('aria-pressed', activeTypes.has(t) ? 'true' : 'false');
          updateVisibility();
        });
        legendEl.appendChild(item);
      });

      // Gradient defs for links
      var defs = svg.append('defs');
      data.links.forEach((l, i) => {
        var lineColor = relationColor(l);
        var grad = defs.append('linearGradient').attr('id', 'lg-' + i).attr('gradientUnits', 'userSpaceOnUse');
        grad.append('stop').attr('offset', '0%').attr('stop-color', lineColor).attr('stop-opacity', 0.52);
        grad.append('stop').attr('offset', '100%').attr('stop-color', lineColor).attr('stop-opacity', 0.24);
      });

      // Card dimensions
      var cardW = d => d.is_center ? 130 : 100;
      var cardH = d => d.is_center ? 170 : 140;
      var coverH = d => d.is_center ? 110 : 85;

      var sim = d3.forceSimulation(data.nodes)
        .force('link', d3.forceLink(data.links).id(d => d.id).distance(200))
        .force('charge', d3.forceManyBody().strength(-500))
        .force('center', d3.forceCenter(width / 2, height / 2))
        .force('collision', d3.forceCollide().radius(d => d.is_center ? 100 : 80));

      // Links — curved
      g.selectAll('.link')
        .data(data.links).join('path')
        .attr('class', 'graph-link')
        .attr('fill', 'none')
        .attr('stroke', (d, i) => 'url(#lg-' + i + ')')
        .attr('stroke-width', d => Math.max(1.5, d.weight * 1.2))
        .attr('opacity', 0)
        .transition().duration(800).delay((d, i) => 200 + i * 30)
        .attr('opacity', 1);

      var linkSel = g.selectAll('path');

      // Nodes — card groups
      var node = g.selectAll('.node')
        .data(data.nodes).join('g')
        .attr('class', 'graph-node')
        .attr('cursor', 'pointer')
        .style('opacity', 0);

      // Drag — работает и на touch
      node.call(d3.drag()
        .on('start', (e, d) => { if (!e.active) sim.alphaTarget(0.3).restart(); d.fx = d.x; d.fy = d.y; })
        .on('drag', (e, d) => { d.fx = e.x; d.fy = e.y; })
        .on('end', (e, d) => { if (!e.active) sim.alphaTarget(0); d.fx = null; d.fy = null; })
      );

      // Desktop: click → перейти к книге, hover → tooltip
      if (!isMobile) {
        node.on('click', (e, d) => { window.location.href = '/books/' + d.id + '/'; })
            .on('mouseenter', showTooltip)
            .on('mousemove', showTooltip)
            .on('mouseleave', hideTooltip);
      }

      // Mobile: tap на карточку → модалка (но не на подпись)
      if (isMobile) {
        node.on('click', (e, d) => {
          e.stopPropagation();
          showMobileModal(d);
        });
      }

      // Animate in
      node.transition().duration(600).delay((d, i) => i * 80).style('opacity', 1);

      // Card background
      node.append('rect')
        .attr('x', d => -cardW(d) / 2)
        .attr('y', d => -cardH(d) / 2)
        .attr('width', d => cardW(d))
        .attr('height', d => cardH(d))
        .attr('rx', 0)
        .attr('fill', bg)
        .attr('stroke', d => d.is_center ? ink : border)
        .attr('stroke-width', d => d.is_center ? 2 : 1)
        .style('filter', 'none');

      // Cover image clips
      data.nodes.forEach(d => {
        if (d.cover) {
          defs.append('clipPath').attr('id', 'cc-' + d.id)
            .append('rect')
            .attr('x', -cardW(d) / 2 + 6).attr('y', -cardH(d) / 2 + 6)
            .attr('width', cardW(d) - 12).attr('height', coverH(d)).attr('rx', 0);
        }
      });

      node.each(function(d) {
        var el = d3.select(this);
        if (d.cover) {
          el.append('image').attr('href', d.cover)
            .attr('x', -cardW(d) / 2 + 6).attr('y', -cardH(d) / 2 + 6)
            .attr('width', cardW(d) - 12).attr('height', coverH(d))
            .attr('clip-path', 'url(#cc-' + d.id + ')')
            .attr('preserveAspectRatio', 'xMidYMid slice');
        } else {
          el.append('rect')
            .attr('x', -cardW(d) / 2 + 6).attr('y', -cardH(d) / 2 + 6)
            .attr('width', cardW(d) - 12).attr('height', coverH(d))
            .attr('rx', 0).attr('fill', surface).attr('stroke', border);
        }
      });

      // Title — на мобильном это ссылка на книгу
      node.each(function(d) {
        var el = d3.select(this);
        var label = d.title.length > 16 ? d.title.slice(0, 14) + '...' : d.title;
        var yPos = cardH(d) / 2 - (d.is_center ? 24 : 20);

        var titleText = el.append('text')
          .text(label)
          .attr('y', yPos)
          .attr('text-anchor', 'middle')
          .attr('font-size', d.is_center ? '12px' : '10px')
          .attr('font-weight', '400')
          .attr('fill', ink)
          .attr('text-decoration', isMobile ? 'underline' : 'none')
          .attr('cursor', 'pointer');

        if (isMobile) {
          titleText.on('click', function(e) {
            e.stopPropagation();
            window.location.href = '/books/' + d.id + '/';
          });
        }
      });

      // Authors
      node.append('text')
        .text(d => { var a = d.authors || ''; return a.length > 18 ? a.slice(0, 16) + '...' : a; })
        .attr('y', d => cardH(d) / 2 - (d.is_center ? 10 : 8))
        .attr('text-anchor', 'middle')
        .attr('font-size', '9px')
        .attr('fill', ghost);

      function nodeId(value) {
        return value && typeof value === 'object' ? value.id : value;
      }
      function visibleNodeIds() {
        var center = data.nodes.find(n => n.is_center) || data.nodes[0];
        var visible = new Set(center ? [center.id] : []);
        var activeLinks = data.links.filter(l => activeTypes.has(l.type));
        var changed = true;
        while (changed) {
          changed = false;
          activeLinks.forEach(l => {
            var sourceId = nodeId(l.source);
            var targetId = nodeId(l.target);
            if (visible.has(sourceId) && !visible.has(targetId)) {
              visible.add(targetId);
              changed = true;
            }
            if (visible.has(targetId) && !visible.has(sourceId)) {
              visible.add(sourceId);
              changed = true;
            }
          });
        }
        return visible;
      }
      function updateVisibility() {
        var visible = visibleNodeIds();
        linkSel.interrupt()
          .style('display', d => {
            var sourceId = nodeId(d.source);
            var targetId = nodeId(d.target);
            return activeTypes.has(d.type) && visible.has(sourceId) && visible.has(targetId) ? null : 'none';
          })
          .attr('opacity', d => activeTypes.has(d.type) ? 1 : 0);
        node.interrupt()
          .style('display', d => visible.has(d.id) ? null : 'none')
          .style('opacity', d => visible.has(d.id) ? 1 : 0);
      }
      updateVisibility();

      // Tick
      sim.on('tick', () => {
        linkSel.attr('d', d => {
          var dx = d.target.x - d.source.x;
          var dy = d.target.y - d.source.y;
          var dr = Math.sqrt(dx * dx + dy * dy) * 0.8;
          return 'M' + d.source.x + ',' + d.source.y + 'A' + dr + ',' + dr + ' 0 0,1 ' + d.target.x + ',' + d.target.y;
        });
        node.attr('transform', d => 'translate(' + d.x + ',' + d.y + ')');
      });
    });
})();
</script>
{% endblock %}
