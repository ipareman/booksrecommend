{% extends "core/base.html" %}
{% block title %}{{ title }} — Строка{% endblock %}

{% block content %}
<div class="wrap page ticket-page">
  <div class="ticket-page__head">
    <h1>{{ title }}</h1>
    <a href="{% url 'ticket_list' %}" class="lnk-muted">Все тикеты</a>
  </div>

  <form method="post" class="ticket-form">
    {% csrf_token %}
    <label>Тема{{ form.subject }}</label>
    <label>Описание{{ form.body }}</label>
    <label>Приоритет{{ form.priority }}</label>
    <button type="submit" class="btn btn-primary">Отправить</button>
  </form>
</div>
{% endblock %}
