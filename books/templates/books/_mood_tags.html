<div id="mood-tags" class="book-mood-tags">
  {% for bm in moods %}
  <span class="book-mood-tag"
        title="{{ bm.mood.get_category_display }}: {{ bm.mood.name }} ({{ bm.vote_count }} голосов)">
    {{ bm.mood.name }}
    {% if bm.vote_count > 0 %}
    <span class="book-mood-tag__count">{{ bm.vote_count }}</span>
    {% endif %}
    {% if user.is_authenticated %}
    <button class="book-mood-tag__vote"
            hx-post="{% url 'vote_mood' book.pk bm.mood.pk %}"
            hx-target="#mood-tags"
            hx-swap="outerHTML"
            hx-headers='{"X-CSRFToken":"{{ csrf_token }}"}'
            title="Согласен">+1</button>
    {% endif %}
  </span>
  {% endfor %}
  {% if not moods %}
  <span style="font-size:12px;color:var(--ghost)">Настроение пока не определено</span>
  {% endif %}
</div>
